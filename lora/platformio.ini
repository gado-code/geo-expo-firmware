; ============================================================================
;  GEO-EXPO LoRa  ·  Subproyecto independiente (red LoRa E1 P2P -> E2 malla)
; ----------------------------------------------------------------------------
;  Este platformio.ini es SOLO de lora/. No hereda nada del platformio.ini de
;  la raíz (llavero DevKit V1 + BLE) y no cambia su binario: la incidencia I12
;  del llavero no se reabre con nada de lo que se compile aquí.
;
;  Todo se ejecuta DESDE ESTA CARPETA (cd lora):
;      pio test -e native                    <- pruebas en el PC, sin placa
;      pio run  -e heltec_v3                 <- compilar el firmware del nodo
;      pio run  -e heltec_v3 -t upload --upload-port COMx     <- flashear UNA placa
;      pio device monitor -e heltec_v3 --port COMx
;  Las DOS placas llevan el MISMO binario: el ID sale de la MAC (o de NVS).
;  Diseño completo en DISENO.md; manual de uso en README.md.
; ============================================================================

[platformio]
default_envs = heltec_v3

; ============================================================================
;  NODO — Heltec WiFi LoRa 32 V3 (ESP32-S3 + SX1262)
; ============================================================================
[env:heltec_v3]
platform        = espressif32@6.9.0          ; arduino-esp32 2.0.17, igual que el llavero
board           = heltec_wifi_lora_32_V3     ; el JSON de la placa ya define ARDUINO_USB_MODE=1
framework       = arduino
monitor_speed   = 115200
monitor_filters = time, esp32_exception_decoder
; La V3 tiene el mismo auto-reset DTR->GPIO0 que la DevKit: con DTR activo el
; firmware vería el botón PRG pulsado. Igual que en la raíz, el monitor no
; toca DTR/RTS.
monitor_dtr     = 0
monitor_rts     = 0
; Versiones FIJADAS (exactas, sin ^): un cambio de librería cambia el binario
; y, por la lección de I12, cada binario nuevo se prueba con 10 arranques.
lib_deps =
    jgromes/RadioLib @ 7.7.1
    olikraus/U8g2 @ 2.36.18
build_flags =
    -D CORE_DEBUG_LEVEL=1
    ; D3 (DISENO §0/§2.3): la V3 lleva un puente CP2102 entre el USB-C y la
    ; UART0. Con CDC_ON_BOOT=1, Serial saldría por el USB nativo (GPIO19/20),
    ; que en la V3 NO llega al conector, y la consola quedaría muda.
    -D ARDUINO_USB_CDC_ON_BOOT=0
    -D PLACA_HELTEC_V3
    ; OLED SSD1306 opcional: con =0 no se compila pantalla.cpp ni se enlaza U8g2.
    -D GEOLORA_OLED=1
; Las pruebas son de la lógica pura (lib/geolora) y se ejecutan en el PC.
; En la placa no hay nada que probar con Unity: se excluyen para que un
; 'pio test' sin -e no intente flashear.
test_ignore = *

; ============================================================================
;  PRUEBAS EN EL PC — sin placa, sin Arduino, sin RadioLib
; ----------------------------------------------------------------------------
;  Compila lib/geolora con el g++ del sistema (WinLibs en esta máquina) y
;  corre test/. Se usa -std=gnu++11 A PROPÓSITO: es el estándar con el que
;  arduino-esp32 2.0.17 compila la librería en la placa, así un uso de C++14/17
;  se caza aquí y no al compilar para el ESP32-S3.
; ============================================================================
[env:native]
platform        = native
test_framework  = unity
build_flags     = -std=gnu++11 -Wall -Wextra
