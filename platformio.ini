; ============================================================================
;  GEO-EXPO ALERT  ·  Firmware etapa 1 (solo periféricos integrados)
; ----------------------------------------------------------------------------
;  Entorno ACTUAL  : ESP32 DevKit V1 (ESP32-WROOM-32)   ->  env:devkit_v1
;  Entorno FUTURO  : Heltec WiFi LoRa 32 V3 (ESP32-S3)  ->  env:heltec_v3
;
;  Compilar/flashear la placa de hoy:   pio run -e devkit_v1 -t upload
;  Monitor serie:                       pio device monitor -e devkit_v1
; ============================================================================

[platformio]
default_envs = devkit_v1
src_dir = src

; --- Opciones comunes a todos los entornos -----------------------------------
[env]
framework       = arduino
monitor_speed   = 115200
monitor_filters = time, colorize, esp32_exception_decoder
upload_speed    = 921600
; NimBLE-Arduino: misma API en ESP32, ESP32-S3 y ESP32-C3.
; Se fija la versión 1.4.x (línea estable para arduino-esp32 2.0.x).
lib_deps =
    h2zero/NimBLE-Arduino @ ^1.4.3
build_flags =
    -D CORE_DEBUG_LEVEL=1

; ============================================================================
;  ENTORNO ACTUAL — ESP32 DevKit V1 (ESP32-WROOM-32, Xtensa LX6)
; ============================================================================
[env:devkit_v1]
platform = espressif32@6.9.0        ; -> arduino-esp32 2.0.17 (probado y estable)
board    = esp32doit-devkit-v1

; ============================================================================
;  ENTORNO FUTURO — Heltec WiFi LoRa 32 V3 (ESP32-S3 + SX1262)
;  Migración prevista: 19-sep. Ver README.md -> "Migración a Heltec V3".
;  El ESP32-S3 usa USB nativo (CDC): se habilita con los flags ARDUINO_USB_*.
; ============================================================================
[env:heltec_v3]
platform = espressif32@6.9.0
board    = heltec_wifi_lora_32_V3
build_flags =
    ${env.build_flags}
    -D BOARD_HELTEC_V3
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
