; ============================================================================
;  GEO-EXPO ALERT  ·  Firmware etapa 1 (solo periféricos integrados)
; ----------------------------------------------------------------------------
;  Entorno ACTUAL  : ESP32 DevKit V1 (ESP32-WROOM-32)   ->  env:devkit_v1
;  Entorno OPCIONAL: Heltec WiFi LoRa 32 V3 (ESP32-S3)  ->  env:heltec_v3
;                    NO es el camino del proyecto: primero va el llavero con
;                    la DevKit V1. El entorno se deja preparado por si sobra
;                    tiempo al final; nadie lo esta manteniendo ni probando.
;
;  Compilar/flashear la placa de hoy:   pio run -e devkit_v1 -t upload
;  Monitor serie:                       pio device monitor -e devkit_v1
; ============================================================================

[platformio]
default_envs = devkit_v1
src_dir = src

; --- Opciones comunes a todos los entornos -----------------------------------
[env]
framework       = arduino
monitor_speed   = 115200
monitor_filters = time, esp32_exception_decoder
; El circuito de auto-reset de la placa conecta DTR->GPIO0 y RTS->EN. Al abrir
; el monitor, DTR queda activo y pone GPIO0 a BAJO: el firmware lo lee como el
; boton BOOT mantenido y dispara un "ALERT:2" fantasma a los 3 s. Con estas dos
; lineas el monitor no toca DTR/RTS y el log sale limpio.
monitor_dtr     = 0
monitor_rts     = 0
upload_speed    = 115200    ; con este cable 460800 y 921600 fallan ("Unable to verify flash chip connection")
; NimBLE-Arduino: misma API en ESP32, ESP32-S3 y ESP32-C3.
; Se fija la versión 1.4.x (línea estable para arduino-esp32 2.0.x).
lib_deps =
    h2zero/NimBLE-Arduino @ ^1.4.3
build_flags =
    -D CORE_DEBUG_LEVEL=1

; ============================================================================
;  ENTORNO ACTUAL — ESP32 DevKit V1 (ESP32-WROOM-32, Xtensa LX6)
; ============================================================================
[env:devkit_v1]
platform = espressif32@6.9.0        ; -> arduino-esp32 2.0.17 (probado y estable)
board    = esp32doit-devkit-v1
build_flags =
    ${env.build_flags}
    -D UNITY_INCLUDE_DOUBLE         ; las pruebas de lib/nmea comparan doubles
    ; Este firmware es SOLO periferico: nunca escanea ni hace de central.
    ; Desactivar esos roles recorta binario e IRAM, que iba al 83 % y dejaba
    ; el arranque del controlador BT sin margen (ver README, incidencia I10).
    -D CONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
    -D CONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED

; ============================================================================
;  ENTORNO OPCIONAL — Heltec WiFi LoRa 32 V3 (ESP32-S3 + SX1262)
;  SIN FECHA y sin probar: es un "si nos sobra tiempo", no un plan. La
;  prioridad acordada es terminar el llavero sobre la DevKit V1.
;  El ESP32-S3 usa USB nativo (CDC): se habilita con los flags ARDUINO_USB_*.
; ============================================================================
[env:heltec_v3]
platform = espressif32@6.9.0
board    = heltec_wifi_lora_32_V3
build_flags =
    ${env.build_flags}
    -D BOARD_HELTEC_V3
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

; ============================================================================
;  ENTORNO DE PRUEBAS EN EL PC — sin placa, sin GPS
; ----------------------------------------------------------------------------
;  Compila lib/nmea con el g++ del sistema y corre las pruebas de test/.
;  Sirve para desarrollar el módulo GPS mientras no hay hardware:
;      pio test -e native
;
;  Se anulan a propósito los ajustes heredados de [env] (framework, librería
;  BLE, filtros del monitor): aquí no hay Arduino ni puerto serie.
; ============================================================================
[env:native]
platform        = native
framework       =
lib_deps        =
monitor_filters =
test_framework  = unity
build_flags     = -std=gnu++17 -Wall -Wextra -D UNITY_INCLUDE_DOUBLE
