; ============================================================================
;  GEO-EXPO ALERT  ·  Firmware
; ----------------------------------------------------------------------------
;  Cuatro firmwares distintos salen de aquí:
;
;    devkit_v1       ESP32 DevKit V1 - SOLO periféricos integrados (botón BOOT
;                    y LED). Es el entorno de siempre, el de probar sin cablear.
;    devkit_llavero  La MISMA placa, pero con el llavero ya cableado de verdad:
;                    botón externo en GPIO4, zumbador piezo en GPIO25 y medida
;                    de batería en GPIO34 (la Heltec usa otros pines).
;    heltec_tag      Heltec WiFi LoRa 32 V3 -> el llavero del enlace LoRa.
;    heltec_finder   Heltec WiFi LoRa 32 V3 -> el buscador (estilo AirTag).
;
;  Y además:
;    native          Las pruebas de lib/ corriendo en el PC, sin ninguna placa.
;
;  Comandos habituales:
;    pio run -e devkit_v1 -t upload        flashear la DevKit
;    pio run -e heltec_tag -t upload       flashear el llavero LoRa
;    pio run -e heltec_finder -t upload    flashear el buscador LoRa
;    pio device monitor -e <entorno>       ver el monitor serie
;    pio test -e native                    las 87 pruebas, en el PC, en 2 s
; ============================================================================

[platformio]
default_envs = devkit_v1
src_dir = src

; --- Opciones comunes a todos los entornos de placa ---------------------------
[env]
framework       = arduino
monitor_speed   = 115200
monitor_filters = time, esp32_exception_decoder
; El circuito de auto-reset de la placa conecta DTR->GPIO0 y RTS->EN. Al abrir
; el monitor, DTR queda activo y pone GPIO0 a BAJO: el firmware lo lee como el
; boton BOOT mantenido y dispara un "ALERT:2" fantasma a los 3 s. Con estas dos
; lineas el monitor no toca DTR/RTS y el log sale limpio.
monitor_dtr     = 0
monitor_rts     = 0
upload_speed    = 115200    ; con este cable 460800 y 921600 fallan ("Unable to verify flash chip connection")
build_flags =
    -D CORE_DEBUG_LEVEL=1

; ============================================================================
;  FAMILIA DevKit V1  (ESP32-WROOM-32, Xtensa LX6)  ·  BLE + botón + GPS
; ----------------------------------------------------------------------------
;  src/lora/ NO entra aquí: esa carpeta es el firmware de las Heltec.
;  NimBLE-Arduino: se fija la 1.4.x, la línea estable para arduino-esp32 2.0.x.
; ============================================================================
[devkit_base]
platform = espressif32@6.9.0        ; -> arduino-esp32 2.0.17 (probado y estable)
board    = esp32doit-devkit-v1
build_src_filter = +<*> -<lora/>
lib_deps =
    h2zero/NimBLE-Arduino @ ^1.4.3
build_flags =
    ${env.build_flags}
    -D UNITY_INCLUDE_DOUBLE         ; las pruebas de lib/nmea comparan doubles
    ; Este firmware es SOLO periferico: nunca escanea ni hace de central.
    ; Desactivar esos roles recorta binario e IRAM, que iba al 83 % y dejaba
    ; el arranque del controlador BT sin margen (ver README, incidencia I10).
    -D CONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
    -D CONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED

; --- Sólo periféricos integrados: botón BOOT (GPIO0) y LED (GPIO2) -----------
[env:devkit_v1]
extends     = devkit_base
build_flags = ${devkit_base.build_flags}

; --- El llavero cableado de verdad -------------------------------------------
;  Botón externo a masa en GPIO4 (NO en GPIO0/2/12/15, que son strapping),
;  zumbador piezo pasivo en GPIO25 y divisor de batería 2:1 en GPIO34.
;  Cuando llegue el módulo GPS, descomenta GPS_UART_ENABLED.
[env:devkit_llavero]
extends = devkit_base
build_flags =
    ${devkit_base.build_flags}
    -D PIN_BUTTON_CFG=4
    -D PIN_BUZZER_CFG=25
    -D PIN_VBAT_CFG=34
    ; -D GPS_UART_ENABLED=1
    ; -D ALERT_WITH_POSITION=1      ; sólo cuando el equipo de la app lo acuerde

; ============================================================================
;  FAMILIA Heltec WiFi LoRa 32 V3  (ESP32-S3 + SX1262)  ·  enlace punto a punto
; ----------------------------------------------------------------------------
;  Aquí NO se compila src/main.cpp: el firmware es src/lora/main_lora.cpp.
;
;  ⚠️ NADA de ARDUINO_USB_CDC_ON_BOOT aquí. La Heltec V3 NO expone el USB
;  nativo del S3: su conector USB-C va a un puente CP2102 cableado a UART0.
;  Con ese flag, `Serial` pasaría a ser el USB-Serial-JTAG interno (GPIO19/20),
;  que en esta placa no está conectado a nada, y nos quedaríamos SIN MONITOR
;  SERIE: ni banner, ni trazas, ni comandos (FIND, STOP, CAL...). O sea, sin
;  la demo entera y sin forma de depurar. El puerto es /dev/ttyUSB0.
;  Por eso se heredan también monitor_dtr/monitor_rts de [env]: el CP2102 de
;  esta placa lleva el mismo circuito de auto-reset que la DevKit.
;
;  ⚠️ LORA_FREQ_MHZ debe corresponder a la banda de TU placa y de tu país:
;     915.0 en América (placas US915), 868.0 en Europa (placas EU868).
;  ⚠️ Cambia GEO_LINK_KEY antes de la expo: la clave de ejemplo es pública.
; ============================================================================
[heltec_base]
platform     = espressif32@6.9.0
board        = heltec_wifi_lora_32_V3
build_src_filter = +<lora/>
upload_speed = 921600               ; por CP2102; bájalo a 115200 si falla
lib_deps =
    jgromes/RadioLib @ ^6.6.0
build_flags =
    ${env.build_flags}
    -D BOARD_HELTEC_V3
    -D LORA_FREQ_MHZ=915.0
    -D GEO_LINK_KEY='"geo-expo-2026-cambiame"'
    ; Zumbador del llavero/buscador (quita el comentario cuando esté soldado).
    ; OJO: en el ESP32-S3 NO existen los GPIO22-25 y los 26-32 son de la
    ; flash/PSRAM. GPIO6 y GPIO7 están libres. (Hay un #error por si acaso.)
    ; -D PIN_BUZZER_CFG=6
    ; Medida de batería de la V3: divisor en GPIO1, habilitado por GPIO37.
    ; -D PIN_VBAT_CFG=1

; --- El llavero que lleva la persona ------------------------------------------
[env:heltec_tag]
extends = heltec_base
build_flags =
    ${heltec_base.build_flags}
    -D LORA_ROLE=1

; --- El buscador que lo encuentra ---------------------------------------------
[env:heltec_finder]
extends = heltec_base
build_flags =
    ${heltec_base.build_flags}
    -D LORA_ROLE=2

; ============================================================================
;  ENTORNO DE PRUEBAS EN EL PC — sin placa, sin GPS y sin radio
; ----------------------------------------------------------------------------
;  Compila las librerías de lib/ con el g++ del sistema y corre test/:
;      pio test -e native
;
;  Cubre lib/nmea (GPS), lib/panic (botón), lib/link (protocolo LoRa),
;  lib/ranging (cercanía) y lib/buzzer (patrones de sonido). Es la red de
;  seguridad para trabajar sin tener las placas delante.
;
;  Se anulan a propósito los ajustes heredados de [env] (framework, filtros del
;  monitor): aquí no hay Arduino ni puerto serie.
; ============================================================================
[env:native]
platform        = native
framework       =
lib_deps        =
monitor_filters =
test_framework  = unity
build_flags     = -std=gnu++17 -Wall -Wextra -D UNITY_INCLUDE_DOUBLE
